n", "By the way", "See you"], 0], ["\"Disagree\" is the opposite of...", ["agree", "ask", "stop"], 0], ["\"Honestly\" means...", ["بصراحة", "دايماً", "غالباً"], 0]]}, {"level": "B2", "id": "b2-01", "free": true, "title": "Second and third conditionals", "grammar": "Second: If I had more time, I would learn French. Third: If I had left earlier, I would have caught the train.", "vocab": [["Hypothetical", "افتراضي"], ["Regret", "ندم"], ["Would have", "كان هـ"], ["Wish", "يتمنى"], ["If only", "ياريت"], ["Imagine", "تخيل"]], "quiz": [["If I ___ rich, I would travel the world.", ["were", "am", "will be"], 0], ["If she had studied, she ___ passed.", ["would have", "would", "will"], 0], ["\"I wish I ___ more time.\"", ["had", "have", "will have"], 0]]}, {"level": "B2", "id": "b2-02", "free": false, "title": "Advanced passive and causative", "grammar": "have something done: I had my car repaired. It is said that... He is believed to be abroad.", "vocab": [["Repaired", "اتصلّح"], ["Installed", "اتركّب"], ["Reportedly", "حسب ما قيل"], ["Believed", "يُعتقد"], ["Arranged", "اتنظّم"], ["Delegate", "يفوّض"]], "quiz": [["I ___ my laptop fixed yesterday.", ["had", "did", "was"], 0], ["It ___ that prices will rise.", ["is said", "says", "said"], 0], ["\"Delegate\" means...", ["يفوّض", "يلغي", "يؤجل"], 0]]}, {"level": "B2", "id": "b2-03", "free": false, "title": "Linking words and cohesion", "grammar": "Contrast: however, although, despite. Addition: moreover, in addition. Result: therefore, as a result.", "vocab": [["However", "لكن"], ["Although", "رغم أن"], ["Therefore", "لذلك"], ["Moreover", "علاوة على ذلك"], ["Despite", "رغم"], ["As a result", "نتيجة لذلك"]], "quiz": [["___ it was late, we finished the work.", ["Although", "Despite of", "Because"], 0], ["Prices rose; ___, sales fell.", ["therefore", "although", "despite"], 0], ["___ the rain, we went out.", ["Despite", "Although", "However"], 0]]}, {"level": "B2", "id": "b2-04", "free": false, "title": "Business meetings and negotiation", "grammar": "Useful phrases: Let's move on to..., Could we agree on...?, I see your point, but..., We can offer...", "vocab": [["Agenda", "جدول أعمال"], ["Minutes", "محضر الاجتماع"], ["Negotiate", "يفاوض"], ["Compromise", "حل وسط"], ["Proposal", "عرض"], ["Terms", "شروط"]], "quiz": [["The list of topics in a meeting is the...", ["agenda", "receipt", "balance"], 0], ["\"Compromise\" means...", ["حل وسط", "رفض", "تأجيل"], 0], ["A written record of a meeting is the...", ["minutes", "terms", "agenda"], 0]]}, {"level": "B2", "id": "b2-05", "free": false, "title": "Finance and accounting vocabulary", "grammar": "Use precise terms: assets, liabilities, revenue, expenses, profit, cash flow, accounts payable, accounts receivable.", "vocab": [["Assets", "أصول"], ["Liabilities", "التزامات"], ["Revenue", "إيرادات"], ["Expenses", "مصروفات"], ["Accounts payable", "حسابات دائنة (موردين)"], ["Accounts receivable", "حسابات مدينة (عملاء)"]], "quiz": [["Money owed TO suppliers is...", ["accounts payable", "accounts receivable", "revenue"], 0], ["Money customers owe YOU is...", ["accounts receivable", "liabilities", "expenses"], 0], ["Revenue minus expenses =", ["profit", "assets", "balance"], 0]]}, {"level": "B2", "id": "b2-06", "free": false, "title": "Inversion and emphasis", "grammar": "For emphasis: Never have I seen..., Rarely do we..., Not only did he..., Hardly had she arrived when...", "vocab": [["Never", "أبداً"], ["Rarely", "نادراً"], ["Not only", "ليس فقط"], ["Hardly", "بالكاد"], ["Scarcely", "بالكاد"], ["Seldom", "نادراً"]], "quiz": [["Rarely ___ late.", ["do we arrive", "we arrive", "arrive we"], 0], ["Not only ___ the work, he also helped us.", ["did he finish", "he finished", "finished he"], 0], ["\"Seldom\" means...", ["rarely", "often", "always"], 0]]}, {"level": "B2", "id": "b2-07", "free": false, "title": "Idioms and natural expressions", "grammar": "Idioms are fixed phrases: a piece of cake (very easy), under the weather (sick), break the ice (start a conver *{box-sizing:border-box}
.wrap{font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:#f4f7fc;color:#1d2433;line-height:1.6;border-radius:14px;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#fff;box-shadow:0 1px 6px #0001}
.logo{font-weight:800;font-size:20px;color:#1b6ef3;text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
nav a,nav button.link{color:#1d2433;text-decoration:none;font-weight:600;background:none;border:0;font:inherit;font-weight:600;cursor:pointer;padding:0}
main{padding:18px 14px;min-height:60vh}
footer{text-align:center;color:#778;padding:14px;font-size:13px}
.hero{text-align:center;padding:26px 6px}
.hero h1{font-size:28px;margin:0 0 8px}
.btn{display:inline-block;background:#1b6ef3;color:#fff;border:0;border-radius:10px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;margin:3px}
.btn.alt{background:#fff;color:#1b6ef3;border:2px solid #1b6ef3}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0001}
.card h3{margin-top:0}
.price{font-size:26px;font-weight:800;color:#1b6ef3}
.tag{display:inline-block;background:#e6f0ff;color:#1b6ef3;border-radius:20px;padding:1px 10px;font-size:13px;font-weight:700}
.tag.lock{background:#fff3e0;color:#b45309}
label{display:block;margin:10px 0 4px;font-weight:600}
input{width:100%;padding:10px;border:1px solid #ccd;border-radius:8px;font:inherit}
.box{max-width:400px;margin:0 auto}
table{width:100%;border-collapse:collapse}
td,th{padding:7px;border-bottom:1px solid #eee;text-align:left}
td.ar{direction:rtl;text-align:right}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:2px solid #dde;background:#fff;border-radius:10px;font:inherit;cursor:pointer}
.opt.right{border-color:#16a34a;background:#e8f8ee}.opt.wrong{border-color:#dc2626;background:#fdeaea}
.bar{height:10px;background:#dde;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#16a34a}
.msg{padding:10px;border-radius:8px;margin:10px 0}.msg.err{background:#fdeaea;color:#b91c1c}.msg.good{background:#e8f8ee;color:#166534}
.note{font-size:13px;color:#667}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabs button{border:2px solid #1b6ef3;background:#fff;color:#1b6ef3;border-radius:20px;padding:4px 14px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:#1b6ef3;color:#fff}
.az a{display:inline-block;margin:2px 4px;font-weight:700;color:#1b6ef3;text-decoration:none}
.sm{font-size:14px;color:#556}
`;
const PLANS = [
  { id: 'free', name: 'Free', price: 0, period: '', feats: ['One free lesson in every level', 'Quizzes and progress tracking', 'Word list'] },
  { id: 'monthly', name: 'Monthly', price: 99, period: 'EGP / month', feats: ['All ' + DATA.lessons.length + ' lessons, A1 to B2', 'Unlimited quiz retries', 'New lessons every week'] },
  { id: 'yearly', name: 'Yearly', price: 799, period: 'EGP / year', feats: ['Everything in Monthly', 'Save more than 30%', 'Certificate of completion'] },
];
const RESOURCES = [
  { name: 'USA Learns', url: 'https://www.usalearns.org/free-online-english-courses', level: 'A1-B1', desc: 'Free online English courses with step-by-step units.', task: 'Finish one unit this week, then write 5 sentences using the new words.' },
  { name: 'VOA Learning English', url: 'https://learningenglish.voanews.com/', level: 'A2-B2', desc: 'News and stories written in simple English for learners.', task: 'Read one short story a day and note 5 new words with their Arabic meaning.' },
  { name: 'British Council: Listening', url: 'https://learnenglish.britishcouncil.org/free-resources/listening', level: 'A1-B2', desc: 'Listening exercises sorted by level.', task: 'Listen twice: once without reading, once with the transcript. Retell it in 3 sentences.' },
  { name: 'British Council: Writing', url: 'https://learnenglish.britishcouncil.org/free-resources/writing', level: 'A1-B2', desc: 'Writing practice with tips for emails, messages and short texts.', task: 'Write a 60-word email to a supplier asking about a late invoice.' },
  { name: 'Cambridge Write & Improve', url: 'https://writeandimprove.com/?lang=en-US', level: 'A2-C1', desc: 'A free tool that gives feedback on your writing.', task: 'Submit a paragraph about your workday, then fix the errors it shows.' },
  { name: 'BBC Learning English: Office English', url: 'https://www.bbc.com/learningenglish/english/features/office-english', level: 'B1-B2', desc: 'Short lessons on English used in offices.', task: 'Learn 5 phrases and use them in a practice meeting with a friend.' },
  { name: 'British Council: Business English', url: 'https://learnenglish.britishcouncil.org/free-resources/business', level: 'B1-B2', desc: 'Business English resources for work situations.', task: 'Pick one topic and prepare a 1-minute talk about it for your team.' },
];
function mount(host) {
  const shadow = host.attachShadow({ mode: 'open' });
  shadow.innerHTML = `<style>${CSS}</style><div class="wrap"><header class="top"><a class="logo" href="#/">📘 A to Z</a><nav><a href="#/lessons">Lessons</a><a href="#/words">Word list</a><a href="#/resources">Resources</a><a href="#/pricing">Pricing</a><span id="authlinks"></span></nav></header><main id="app"></main><footer>© A to Z · Preview version (data is kept only while this page is open)</footer></div>`;
  const ROOT = shadow; let ROUTE = '/'; let LEVEL = 'ALL';
  const $ = s => ROOT.querySelector(s); const $$ = s => ROOT.querySelectorAll(s);
  const go = r => { ROUTE = r; render(); };
  const mem = {};
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return k in mem ? JSON.parse(mem[k]) : d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { mem[k] = JSON.stringify(v); } },
  };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  async function hash(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  const users = () => store.get('users', {});
  const me = () => { const e = store.get('session', null); return e ? users()[e] : null; };
  const saveUser = u => { const us = users(); us[u.email] = u; store.set('users', us); };
  const paid = u => u && u.plan && u.plan !== 'free' && (!u.until || u.until > Date.now());
  const L = DATA.lessons;
  const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  function authLinks() {
    const u = me();
    $('#authlinks').innerHTML = u ? `<a href="#/me">${esc(u.name)}</a> <button class="link" id="out">Log out</button>` : `<a href="#/login">Log in</a> <a href="#/register">Sign up</a>`;
    if (u) $('#out').onclick = () => { store.set('session', null); go('/'); };
  }
  const view = {
    home() {
      return `<section class="hero"><h1>Learn English from zero to work-ready</h1><p>${L.length} lessons, ${L.length * 6} key words and ${L.length * 3} quiz questions across 4 levels.</p><a class="btn" href="#/register">Start free</a><a class="btn alt" href="#/pricing">See pricing</a></section>
      <div class="grid">${DATA.levels.map(l => `<div class="card"><span class="tag">${l.id}</span><h3>${l.name}</h3><p>${L.filter(x => x.level === l.id).length} lessons</p></div>`).join('')}</div>`;
    },
    pricing() {
      return `<h2>Pricing</h2><div class="grid">${PLANS.map(p => `<div class="card"><h3>${p.name}</h3><div class="price">${p.price || 'Free'} <small>${p.period}</small></div><ul>${p.feats.map(f => `<li>${f}</li>`).join('')}</ul>${p.id === 'free' ? '' : `<button type="button" class="btn" data-plan="${p.id}">Subscribe</button>`}</div>`).join('')}</div><p class="note">Payment here is a demo (simulated). A real payment gateway is needed to charge money.</p>`;
    },
    register() { return `<div class="box card"><h2>Create account</h2><div id="err"></div><div id="f"><label>Name</label><input name="name"><label>Email</label><input name="email" type="email"><label>Password (6+ characters)</label><input name="pw" type="password"><br><br><button type="button" id="sub" class="btn" style="width:100%">Sign up</button></div></div>`; },
    login() { return `<div class="box card"><h2>Log in</h2><div id="err"></div><div id="f"><label>Email</label><input name="email" type="email"><label>Password</label><input name="pw" type="password"><br><br><button type="button" id="sub" class="btn" style="width:100%">Log in</button></div></div>`; },
    me() {
      const u = me(); if (!u) return view.login();
      const done = u.done || {}; const n = Object.keys(done).length;
      return `<h2>Hello, ${esc(u.name)}</h2><div class="card"><p>Plan: <b>${paid(u) ? PLANS.find(p => p.id === u.plan).name : 'Free'}</b></p><p>Progress: ${n} of ${L.length} lessons</p><div class="bar"><i style="width:${n / L.length * 100}%"></i></div>
      <table><tr><th>Lesson</th><th>Score</th></tr>${L.filter(l => done[l.id] != null).map(l => `<tr><td>${esc(l.title)}</td><td>${done[l.id]}/${l.quiz.length}</td></tr>`).join('') || '<tr><td colspan=2>No lessons finished yet</td></tr>'}</table></div>`;
    },
    lessons() {
      const u = me(); const done = (u && u.done) || {};
      const lv = DATA.levels.filter(l => LEVEL === 'ALL' || l.id === LEVEL);
      return `<h2>Lessons</h2><div class="tabs">${['ALL', ...DATA.levels.map(l => l.id)].map(t => `<button type="button" data-lv="${t}" class="${t === LEVEL ? 'on' : ''}">${t === 'ALL' ? 'All' : t}</button>`).join('')}</div>` +
        lv.map(l => `<h3><span class="tag">${l.id}</span> ${l.name}</h3><div class="grid">${L.filter(x => x.level === l.id).map(x => { const open = x.free || paid(u); return `<div class="card"><h3>${esc(x.title)}</h3><p class="sm">${done[x.id] != null ? '✅ Score ' + done[x.id] + '/' + x.quiz.length : '6 words · grammar · quiz'}</p>${open ? `<a class="btn" href="#/lesson/${x.id}">Open lesson</a>` : `<span class="tag lock">🔒 Subscribers</span><br><br><a class="btn alt" href="#/pricing">Subscribe</a>`}</div>`; }).join('')}</div>`).join('');
    },
    lesson(id) {
      const u = me(); const x = L.find(l => l.id === id); if (!x) return '<p>Lesson not found</p>';
      if (!u) return `<div class="card"><p>Please sign up or log in to open lessons.</p><a class="btn" href="#/register">Sign up</a> <a class="btn alt" href="#/login">Log in</a></div>`;
      if (!(x.free || paid(u))) return `<div class="card"><p>This lesson is for subscribers.</p><a class="btn" href="#/pricing">See pricing</a></div>`;
      const i = L.indexOf(x); const next = L[i + 1];
      return `<h2>${esc(x.title)} <span class="tag">${x.level}</span></h2><div class="card"><h3>Key words</h3><table>${x.vocab.map(v => `<tr><td><b>${esc(v[0])}</b> <button type="button" data-say="${esc(v[0])}" style="border:0;background:none;cursor:pointer" title="Listen">🔊</button></td><td class="ar">${esc(v[1])}</td></tr>`).join('')}</table></div>
      <div class="card" style="margin-top:12px"><h3>Grammar</h3><p>${esc(x.grammar)}</p></div>
      <div class="card" style="margin-top:12px"><h3>Quiz</h3><div id="quiz"></div></div>${next ? `<p><a class="btn alt" href="#/lesson/${next.id}">Next: ${esc(next.title)}</a></p>` : ''}`;
    },
    resources() {
      return `<h2>Free resources</h2><p class="sm">Other websites to practice more. They open in a new tab and are not part of A to Z. Descriptions and tasks are ours.</p><div class="grid">${RESOURCES.map(r => `<div class="card"><span class="tag">${r.level}</span><h3>${esc(r.name)}</h3><p>${esc(r.desc)}</p><p class="sm"><b>Practice:</b> ${esc(r.task)}</p><a class="btn" href="${r.url}" target="_blank" rel="noopener noreferrer">Open website ↗</a></div>`).join('')}</div>`;
    },
    words() {
      const all = {}; L.forEach(l => l.vocab.forEach(v => { all[v[0]] = [v[1], l.level]; }));
      const keys = Object.keys(all).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
      const letters = [...new Set(keys.map(k => k[0].toUpperCase()))];
      return `<h2>Word list</h2><p class="sm">${keys.length} words and phrases from all lessons. Arabic meaning on the right.</p><div class="az">${letters.map(c => `<a href="#/words" data-jump="${c}">${c}</a>`).join('')}</div>` +
        letters.map(c => `<h3 id="L-${c}">${c}</h3><table>${keys.filter(k => k[0].toUpperCase() === c).map(k => `<tr><td><b>${esc(k)}</b> <span class="tag">${all[k][1]}</span></td><td class="ar">${esc(all[k][0])}</td></tr>`).join('')}</table>`).join('');
    },
  };
  function startQuiz(x) {
    let i = 0, score = 0; const q = $('#quiz');
    const qs = x.quiz.map(([t, o, a]) => { const c = o[a]; const s = shuffle(o); return [t, s, s.indexOf(c)]; });
    const show = () => {
      if (i >= qs.length) { const u = me(); u.done = u.done || {}; u.done[x.id] = score; saveUser(u); q.innerHTML = `<div class="msg good">Score: ${score} of ${qs.length} 🎉</div><a class="btn" href="#/lessons">Back to lessons</a>`; return; }
      const [t, o, a] = qs[i];
      q.innerHTML = `<p><b>${i + 1}/${qs.length}</b> ${esc(t)}</p>` + o.map((c, k) => `<button type="button" class="opt" data-k="${k}">${esc(c)}</button>`).join('');
      q.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const k = +b.dataset.k; if (k === a) score++;
        q.querySelectorAll('.opt').forEach(z => { z.disabled = true; if (+z.dataset.k === a) z.classList.add('right'); });
        if (k !== a) b.classList.add('wrong');
        setTimeout(() => { i++; show(); }, 900);
      });
    };
    show();
  }
  async function render() {
    const [, r, arg] = ROUTE.split('/'); const name = r || 'home';
    $('#app').innerHTML = (view[name] || view.home)(arg); authLinks();
    const f = $('#f');
    if (f) {
      const sub = async () => {
        const d = Object.fromEntries([...f.querySelectorAll('input')].map(i => [i.name, i.value]));
        const err = m => { $('#err').innerHTML = `<div class="msg err">${m}</div>`; };
        const email = (d.email || '').trim().toLowerCase();
        if (email.indexOf('@') < 1) return err('Enter a valid email.');
        if (name === 'register') {
          if (!d.name.trim()) return err('Enter your name.');
          if (d.pw.length < 6) return err('Password must be at least 6 characters.');
          if (users()[email]) return err('This email is already registered.');
          saveUser({ name: d.name.trim(), email, ph: await hash(d.pw), plan: 'free', done: {} });
        } else {
          const u = users()[email];
          if (!u || u.ph !== await hash(d.pw)) return err('Wrong email or password.');
        }
        store.set('session', email); go('/lessons');
      };
      $('#sub').onclick = sub;
      f.addEventListener('keydown', e => { if (e.key === 'Enter') sub(); });
    }
    $$('[data-plan]').forEach(b => b.onclick = () => {
      const u = me(); if (!u) { go('/register'); return; }
      const p = PLANS.find(z => z.id === b.dataset.plan);
      u.plan = p.id; u.until = Date.now() + (p.id === 'yearly' ? 365 : 30) * 864e5; saveUser(u); go('/lessons');
    });
    $$('[data-lv]').forEach(b => b.onclick = () => { LEVEL = b.dataset.lv; render(); });
    $$('[data-jump]').forEach(a => a.onclick = e => { e.preventDefault(); e.stopPropagation(); const t = $('#L-' + a.dataset.jump); t && t.scrollIntoView(); });
    $$('[data-say]').forEach(b => b.onclick = () => { try { const s = new SpeechSynthesisUtterance(b.dataset.say); s.lang = 'en-US'; speechSynthesis.speak(s); } catch (e) {} });
    if (name === 'lesson' && $('#quiz')) startQuiz(L.find(l => l.id === arg));
  }
  shadow.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (a && !a.dataset.jump) { e.preventDefault(); ROUTE = a.getAttribute('href').slice(1); render(); host.scrollIntoView && host.scrollIntoView(); }
  });
  render();
}

mount(document.getElementById('root'));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
